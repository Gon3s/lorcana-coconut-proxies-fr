name: Build Coconut cards and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Build the site or check for new Coconut cards
        type: choice
        options: [build, check]
        default: build
      runner:
        description: Runner used to build the cards
        type: choice
        options: [github, local]
        default: github

concurrency:
  group: coconut-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-catalog:
    if: github.repository == 'Gon3s/lorcana-coconut-proxies-fr' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'check'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m coconut check --fetch --report check-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-catalog-check
          path: check-report.json
          if-no-files-found: error

  build:
    if: github.repository == 'Gon3s/lorcana-coconut-proxies-fr' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build')
    # Pull requests always use GitHub's runner. A local runner is opt-in for manual runs.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'local' && fromJSON('["self-hosted","Linux","X64","coconut-pages"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/site.test.js
      - run: python -m coconut build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: coconut-preview
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'build')) && github.repository == 'Gon3s/lorcana-coconut-proxies-fr'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coconut-preview
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
